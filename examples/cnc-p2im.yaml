# P2IM CNC (grbl 0.8c on STM32F407VG), on the Phase 6 STM32F4 map.
#
# This file is examples/stm32f4_clock.yaml with a name, a description, the
# run limits for a USART2 command session, and the peripherals that session
# needs. RCC follow bits and both bit-band windows are the template's.
# TIM2 is the instruction-paced timer plugin (IRQ 28). GPIOA through GPIOE
# are gpio plugins with BSRR at 0x18. The image's EEPROM is a RAM buffer in
# the firmware, not a peripheral: a cold boot reports the failed checksum
# and then uses compiled defaults for the rest of the run. TIM4 (the g540
# timer at 0x40000800) is still unmapped.
#
# The firmware binary is not in this repository, and CI does not run it.
# Download the published ELF yourself from
# https://github.com/RiS3-Lab/p2im-real_firmware (binary/CNC) and pass that
# file to jig-emu. ELF program segments are loaded at p_paddr. A raw bin
# still copies to load.base. examples/cnc-p2im.md is the procedure.
#
# STM32F405/407-class beachhead map.
#
# This is the machine file to copy when you point jig-emu at an image you
# built yourself (a Zephyr sample or a FreeRTOS UART program). It is not a
# vendor HAL. The file contains no firmware. The synthetic proof that the
# same addresses tick and answer Modbus is the plant-floor fixture. A
# recorded smoke of the published P2IM CNC image uses this map with the
# longer timeout above. The procedure for swapping in your own image is in
# the README section "Plant-floor beachhead".
#
# Layout follows RM0090. Flash is the 1 MiB window at 0x08000000. The alias at
# 0x00000000 is not mapped, so a null fetch still faults. SRAM is 128 KiB at
# 0x20000000 (the F405/407 SRAM1+SRAM2 block). CCM is 64 KiB at 0x10000000.
# Resize these three to the part you actually built for. An STM32F429ZI, for
# example, has 2 MiB of flash and 192 KiB of system SRAM plus the 64 KiB CCM.
#
# What is modeled
#   gpioa-e   STM32 GPIO offsets: IDR 0x10, ODR 0x14, BSRR 0x18. A 1 in the
#             low half of BSRR sets ODR, a 1 in the high half clears it.
#             IDR reads 0xFFFF so idle-high inputs look released. MODER and
#             AFR are not cells. A write there is logged and a read returns 0.
#   usart2    Jig byte UART at the USART2 address. Status at +0, data at +4.
#             TXE (bit 7) and TC (bit 6) read as set, because this stub has no
#             shift register. RXNE (bit 5) is set while RX is non-empty.
#             rx_irq 38 is USART2 in the RM0090 vector table. BRR and CR1
#             writes are logged and ignored. Copy the block for another port
#             and change base and rx_irq (USART1 37, USART3 39, UART4 52,
#             UART5 53, USART6 71).
#   rcc       register_block. Ready bits follow the enable bits in the same
#             word (follow). Not an RCC state machine: no lock delay, and
#             CFGR.SWS copies SW on the next read.
#   flash_if  register_block. ACR reads back. FLASH_SR.BSY reads as 0.
#   sram_bitband / peripheral_bitband
#             Cortex-M alias windows. A word store sets or clears one bit
#             of the target. The peripheral window is how HAL enables PLLON.
#   systick   The per-instruction SysTick plugin.
#   NVIC/SCB  Not a region in this file. The Cortex-M backend owns the system
#             control page at 0xE000E000 (ISER, ICER, ISPR, ICPR, IPR, VTOR,
#             AIRCR, SHPR, and the rest of the exception model). Do not map a
#             peripheral over that page. SysTick at 0xE000E010 is the one
#             plugin that sits inside it; the NVIC model does not claim those
#             16 bytes.
#
# Ready bits follow the enable bit in the same register: clear when the
# enable is clear, set when it is set. That is the HAL sequence that waits
# for HSERDY == 0, sets HSEON, then waits for HSERDY == 1. CFGR.SWS copies
# SW, so a wait for HSI, HSE, or PLL completes as soon as SW is written.
# There is still no lock delay and no clock-tree math. FLASH_SR.BSY stays 0
# because nothing here programs flash. Unknown register fields are errors.
# read_set is still available when a bit should stay stuck high.
#
# Filling in the rest
#   1. Run with -v. "unhandled MMIO" lines are offsets inside a window below.
#      "unmapped read/write" lines are addresses this file does not list.
#      unmapped.action is log, so those reads return 0 and the run continues.
#      A fetch of an unmapped address still faults.
#   2. When the image spins on a bit, add a register_block cell at that
#      offset. follow copies an enable bit onto a ready bit (and clears it
#      again when the enable clears). read_set ORs bits on every read.
#      read_mask and read_bits force a field. writable: false ignores stores.
#      Copy the pattern from RCC_CR and FLASH_SR.
#   3. Prefer an unimplemented window for a peripheral you have not looked at
#      yet, and register_block for the few offsets the image actually polls.
#      Do not transcribe the reference manual into a HAL.
#   4. In Ghidra, import the raw bin as ARM Cortex little-endian at the load
#      address (0x08000000 for this file). Constants in 0x40000000..0x5FFFFFFF
#      and 0xE0000000..0xE00FFFFF are the MMIO sites. Cross-check RM0090.
#
# Windows that are listed but not modeled read as 0. A poll of a ready bit in
# one of those windows will not finish until you promote the offset.
#
# Not mapped, on purpose. Copy a 0x400-byte unimplemented window (or a
# register_block, once you know which bits matter) when the trace shows the
# image touching it:
#   TIM3  0x40000400   TIM4  0x40000800   TIM5  0x40000C00
#   TIM6  0x40001000   TIM7  0x40001400   TIM12 0x40001800
#   TIM13 0x40001C00   TIM14 0x40002000
#   RTC   0x40002800   WWDG  0x40002C00   IWDG  0x40003000
#   SPI2  0x40003800   SPI3  0x40003C00
#   I2C2  0x40005800   I2C3  0x40005C00
#   CAN1  0x40006400   CAN2  0x40006800   DAC   0x40007400
#   TIM1  0x40010000   TIM8  0x40010400
#   TIM9  0x40014000   TIM10 0x40014400   TIM11 0x40014800
#   Ethernet MAC 0x40028000 is larger than 0x400. USB OTG FS is 0x50000000.
#   Neither is a serial-line beachhead. Add them only if your image touches them.

name: p2im-cnc
description: >
  P2IM CNC (grbl 0.8c on STM32F407VG). STM32F4 regions, a TIM2 step timer,
  and GPIO BSRR on ports A through E, so a local smoke can pass the USART2
  banner and answer a short Grbl session. The firmware binary is not in
  this repository.
arch: cortex-m
endian: little

load:
  base: 0x08000000

memory:
  - name: flash
    base: 0x08000000
    size: 0x100000
    perms: rx
  - name: ccm
    base: 0x10000000
    size: 0x10000
    perms: rw
  - name: sram
    base: 0x20000000
    size: 0x20000
    perms: rw
  # SRAM bit-band alias, 0x22000000-0x23FFFFFF, onto 0x20000000-0x200FFFFF.
  # The window is 32 MiB because each target bit occupies a word. Only the
  # first 128 KiB of the target is this file's SRAM; the rest reads as 0.
  - name: sram_bitband
    base: 0x22000000
    size: 0x02000000
    perms: rw
    peripheral: bitband
    config:
      target: 0x20000000
  # Stepper timer. tick_every is instructions per update event, not a
  # prescaler. IRQ 28 is TIM2 in the RM0090 vector table. CEN is CR1 bit 0,
  # UIE/UIF are DIER/SR bit 0, and CC1/CC2 follow when CCR1/CCR2 are non-zero.
  - name: tim2
    base: 0x40000000
    size: 0x400
    perms: rw
    peripheral: timer
    config:
      irq: 28
      tick_every: 1500
  - name: usart2
    base: 0x40004400
    size: 0x400
    perms: rw
    peripheral: uart
    config:
      data_offset: 0x04
      status_offset: 0x00
      tx_empty_mask: 0xC0
      rx_ready_mask: 0x20
      rx_irq: 38
  - name: usart3
    base: 0x40004800
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: uart4
    base: 0x40004C00
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: uart5
    base: 0x40005000
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: i2c1
    base: 0x40005400
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: pwr
    base: 0x40007000
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: usart1
    base: 0x40011000
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: usart6
    base: 0x40011400
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: adc
    base: 0x40012000
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: spi1
    base: 0x40013000
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: syscfg
    base: 0x40013800
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: exti
    base: 0x40013C00
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: gpioa
    base: 0x40020000
    size: 0x400
    perms: rw
    peripheral: gpio
    config:
      idr_offset: 0x10
      odr_offset: 0x14
      bsrr_offset: 0x18
      idr: 0xFFFF
  - name: gpiob
    base: 0x40020400
    size: 0x400
    perms: rw
    peripheral: gpio
    config:
      idr_offset: 0x10
      odr_offset: 0x14
      bsrr_offset: 0x18
      idr: 0xFFFF
  - name: gpioc
    base: 0x40020800
    size: 0x400
    perms: rw
    peripheral: gpio
    config:
      idr_offset: 0x10
      odr_offset: 0x14
      bsrr_offset: 0x18
      idr: 0xFFFF
  - name: gpiod
    base: 0x40020C00
    size: 0x400
    perms: rw
    peripheral: gpio
    config:
      idr_offset: 0x10
      odr_offset: 0x14
      bsrr_offset: 0x18
      idr: 0xFFFF
  - name: gpioe
    base: 0x40021000
    size: 0x400
    perms: rw
    peripheral: gpio
    config:
      idr_offset: 0x10
      odr_offset: 0x14
      bsrr_offset: 0x18
      idr: 0xFFFF
  - name: gpiof
    base: 0x40021400
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: gpiog
    base: 0x40021800
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: gpioh
    base: 0x40021C00
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: gpioi
    base: 0x40022000
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: crc
    base: 0x40023000
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: rcc
    base: 0x40023800
    size: 0x400
    perms: rw
    peripheral: register_block
    read_default: 0
    config:
      registers:
        # CR. HSIRDY, HSERDY, PLLRDY, and PLLI2SRDY follow the ON bits.
        # Reset leaves HSION set, so HSIRDY reads set until firmware clears it.
        0x00:
          reset: 0x00000083
          writable: true
          follow:
            - {src: 0, dst: 1}        # HSIRDY follows HSION
            - {src: 16, dst: 17}      # HSERDY follows HSEON
            - {src: 24, dst: 25}      # PLLRDY follows PLLON
            - {src: 26, dst: 27}      # PLLI2SRDY follows PLLI2SON
        # PLLCFGR. Published reset (RM0090). Not decoded.
        0x04:
          reset: 0x24003010
          writable: true
        # CFGR. SWS (bits 3:2) copies SW (bits 1:0) on read.
        0x08:
          reset: 0
          writable: true
          follow:
            - {src: 0, dst: 2, width: 2}
        0x0C: {reset: 0, writable: true}
        0x10: {reset: 0, writable: true}
        0x14: {reset: 0, writable: true}
        0x18: {reset: 0, writable: true}
        0x20: {reset: 0, writable: true}
        0x24: {reset: 0, writable: true}
        0x30: {reset: 0, writable: true}
        0x34: {reset: 0, writable: true}
        0x38: {reset: 0, writable: true}
        0x40: {reset: 0, writable: true}
        0x44: {reset: 0, writable: true}
        0x50: {reset: 0, writable: true}
        0x54: {reset: 0, writable: true}
        0x58: {reset: 0, writable: true}
        0x60: {reset: 0, writable: true}
        0x64: {reset: 0, writable: true}
        # BDCR. LSERDY (bit 1) follows LSEON (bit 0).
        0x70:
          reset: 0
          writable: true
          follow:
            - {src: 0, dst: 1}
        # CSR. LSIRDY (bit 1) follows LSION (bit 0).
        0x74:
          reset: 0
          writable: true
          follow:
            - {src: 0, dst: 1}
        0x80: {reset: 0, writable: true}
        0x84: {reset: 0, writable: true}
  - name: flash_if
    base: 0x40023C00
    size: 0x400
    perms: rw
    peripheral: register_block
    read_default: 0
    config:
      registers:
        # ACR. Latency is writable and reads back. No ready bit.
        0x00: {reset: 0, writable: true}
        0x04: {reset: 0, writable: true}
        0x08: {reset: 0, writable: true}
        # SR. Writes are ignored. BSY (bit 16) reads as 0.
        0x0C:
          reset: 0
          writable: false
          read_mask: 0x00010000
          read_bits: 0
        0x10: {reset: 0, writable: true}
        0x14: {reset: 0, writable: true}
  - name: bkpsram
    base: 0x40024000
    size: 0x1000
    perms: rw
  - name: dma1
    base: 0x40026000
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  - name: dma2
    base: 0x40026400
    size: 0x400
    perms: rw
    peripheral: unimplemented
    read_default: 0
  # Peripheral bit-band alias, 0x42000000-0x43FFFFFF, onto
  # 0x40000000-0x400FFFFF. __HAL_RCC_PLL_ENABLE() stores 1 at 0x42470060,
  # which is RCC_CR bit 24 (PLLON). PLLRDY then follows that bit.
  - name: peripheral_bitband
    base: 0x42000000
    size: 0x02000000
    perms: rw
    peripheral: bitband
    config:
      target: 0x40000000
  - name: systick
    base: 0xE000E010
    size: 0x10
    perms: rw
    peripheral: systick

boot:
  mode: vector
  vector_base: 0x08000000

run:
  # 0 disables the wall clock. The Grbl loop does not halt; the instruction
  # cap stops a session after the banner, the replies, and a short move.
  timeout_ms: 0
  max_instructions: 2400000
  halt_on_bkpt: true
  trace_limit: 128

unmapped:
  action: log
  read_default: 0
  log: true

# USART2 RX is the fuzz input. The checkpoint is taken after the Grbl banner
# has been printed and TX has gone quiet, so each case does not re-run reset.
# The instruction cap is a finished command loop, not a hang. A wall-clock
# timeout still is. CI does not download the ELF or start this campaign.
# examples/cnc-p2im.md has the seeds and the recorded run.
fuzz:
  mode: uart
  uart:
    name: usart2
    max_size: 64
  checkpoint:
    mode: banner
    idle_instructions: 8000
    contains: "Grbl 0.8c"
    max_instructions: 2000000
  # A short Grbl line finishes in well under 120000 instructions ($$ is
  # about 50000 including the reply). idle_instructions ends the case once
  # RX is empty and TX has been quiet for that long, including a partial
  # line that Grbl is still holding. A guest that never drains RX still
  # runs to the cap. That cap is a finished execution (hang_on_limit:
  # false). A wall-clock timeout is a hang.
  exec:
    max_instructions: 120000
    timeout_ms: 8000
    idle_instructions: 8000
  hang_on_limit: false
