[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rehost"
version = "0.1.0"
description = "Firmware-agnostic embedded rehosting for authorized security research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "rehost contributors" }]
keywords = ["emulation", "firmware", "rehosting", "cortex-m", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "pyyaml>=6.0",
    "unicorn>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jig-emu = "rehost.cli:cli"
rehost = "rehost.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rehost = ["fixtures/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
